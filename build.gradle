plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.10' apply false
}

allprojects {
    group = 'com.spectralogic.ds3customcomparator'
    version = '1.0.0-SNAPSHOT'
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    // Use a Java 17 toolchain for compilation
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        // Explicitly set compatibility on the Java extension (avoids deprecated JavaPluginConvention)
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib"
        implementation 'com.spectralogic.ds3autogen:ds3-autogen-api'
        implementation 'com.spectralogic.ds3autogen:ds3-autogen-parser'
        implementation 'com.spectralogic.ds3autogen:ds3-autogen-utils'

        implementation 'com.google.guava:guava:21.0'
        implementation 'org.slf4j:slf4j-api:1.7.12'
        implementation 'org.slf4j:jcl-over-slf4j:1.7.12'

        testImplementation ('org.mockito:mockito-core:1.9.5') {
            exclude group: 'org.hamcrest'
        }
        testImplementation 'junit:junit:4.12'
        testImplementation 'org.hamcrest:hamcrest-library:1.3'
        testImplementation 'org.slf4j:slf4j-simple:1.7.12'
        testImplementation 'com.spectralogic.ds3autogen:ds3-autogen-test-util'
    }
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '8.14'
    distributionType = Wrapper.DistributionType.ALL
}
